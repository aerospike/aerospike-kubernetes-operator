apiVersion: asdb.aerospike.com/v1beta1
kind: AerospikeBackup
metadata:
  name: aerospikebackup
  namespace: aerospike
spec:
  backupService:
    name: aerospikebackupservice-sample
    namespace: aerospike
#  onDemandBackups:
#    - id: first-ad-hoc-backup
#      type: Full
#      routineName: aerospike-aerospikebackup-test-routine
  config:
    aerospike-cluster:
      # Name format: The name must begin with the prefix <backup-namespace>-<backup-name>
      aerospike-aerospikebackup-test-cluster:
        credentials:
          password: admin123
          user: admin
        seed-nodes:
          - host-name: aerocluster.aerospike.svc.cluster.local
            port: 3000
    backup-routines:
      # Name format: The name must begin with the prefix <backup-namespace>-<backup-name>
      aerospike-aerospikebackup-test-routine:
        backup-policy: test-policy
        interval-cron: "@daily"
        incr-interval-cron: "@hourly"
        # Timezone for this routine's crons. When omitted, service.backup.schedule-timezone (default UTC) applies.
        schedule-timezone: Asia/Kolkata
        namespaces: ["test"]
        source-cluster: aerospike-aerospikebackup-test-cluster
        storage: local
        # Back up only records matching a base64-encoded filter expression; allows at most one set in set-list.
        # set-list: ["users"]
        # filter-exp: "<base64 expression>"
      aerospike-aerospikebackup-test-routine1:
        backup-policy: test-policy1
        interval-cron: "@daily"
        incr-interval-cron: "@hourly"
        namespaces: [ "test" ]
        source-cluster: aerospike-aerospikebackup-test-cluster
        storage: s3Storage