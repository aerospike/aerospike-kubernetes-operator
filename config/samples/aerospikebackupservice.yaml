apiVersion: asdb.aerospike.com/v1beta1
kind: AerospikeBackupService
metadata:
  name: aerospikebackupservice-sample
  namespace: aerospike
spec:
  image: aerospike/aerospike-backup-service:3.7.0
  config:
    service:
      http:
        port: 8081
      # Timezone for backup cron expressions: UTC (default), Local, or an IANA name. Changing it restarts the pod.
      # backup:
      #   schedule-timezone: Asia/Kolkata
    backup-policies:
      test-policy:
        parallel: 3
        compact: true
        # Incremental backups cover changes since the last full backup (default: differential).
        incr-mode: cumulative
      test-policy1:
        parallel: 3
    storage:
      local:
        local-storage:
          path: /tmp/localStorage
      s3Storage:
        s3-storage:
          bucket: aerospike-kubernetes-operator-test
          s3-region: us-east-1
          s3-profile: default

  secrets:
    - secretName: aws-secret
      volumeMount:
        name: aws-secret
        mountPath: /home/absuser/.aws/credentials
        subPath: credentials

  service:
    type: LoadBalancer

  podSpec:
    serviceContainer:
      # Hardened container settings, matching the backup service's own Helm chart.
      # - runAsUser and runAsGroup are required with runAsNonRoot: the image runs as the user name "absuser",
      #   so the kubelet cannot verify a non-root user without the numeric ID (65532) and the pod fails to start.
      # - readOnlyRootFilesystem is not set: the pod has no writable /tmp or local-storage volume, so local
      #   backups would fail with "Read-only file system".
      # - Local backup files are written owner-only (0600/0700) for this user.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault

# HTTPS: the backup service serves its API over TLS and the operator connects to it with operatorClientCert.
# The Secret mounted under secrets holds the backup service certificate and key; operatorClientCert reads the
# CA that signed that certificate from its own Secret. Set http.disabled: true to allow HTTPS only.
# spec:
#   secrets:
#     - secretName: abs-tls
#       volumeMount:
#         name: abs-tls
#         mountPath: /etc/abs-tls
#         readOnly: true
#   config:
#     service:
#       http:
#         port: 8081
#       https:
#         port: 8443
#         cert-file: /etc/abs-tls/tls.crt
#         key-file: /etc/abs-tls/tls.key
#   operatorClientCert:
#     secretCertSource:
#       secretName: operator-tls
#       caCertsFilename: ca.crt
