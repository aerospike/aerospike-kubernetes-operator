version: "2"
run:
  go: "1.25"
linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - dogsled
    - dupl
    - errcheck
    - exhaustive
    - ginkgolinter
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - nolintlint
    - prealloc
    - predeclared
    - revive
    - staticcheck
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - whitespace
    - wsl_v5
    - errorlint
    - logcheck
  settings:
    goconst:
      min-len: 2
      min-occurrences: 3
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    govet:
      enable:
        - fieldalignment
        - shadow
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: dot-imports
          arguments:
            - allowedPackages:
                - github.com/onsi/ginkgo/v2
                - github.com/onsi/gomega
        - name: comment-spacings
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
    errorlint:
      errorf: true
      comparison: true
      asserts: true
    custom:
      logcheck:
        type: module
        description: structured logging checker
        original-url: sigs.k8s.io/logtools/logcheck
        settings:
          check:
            structured: false
            deprecations: false
            contextual: false
            with-helpers: false
            parameters: false
            key: true
            verbosity-zero: true
            verbosity-error: true
            value: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
    rules: # Allow dot imports (ST1001) in test code for Ginkgo/Gomega
      - linters:
          - staticcheck
        path: "test/"
        text: "dot imports"
      # errorlint + logcheck: enforce on controllers only; existing linters stay repo-wide
      # TODO: remove this path-except rule and enable errorlint + logcheck repo-wide once
      # existing findings in api/v1, test/, etc. are fixed.
      - linters:
          - errorlint
          - logcheck
        path-except: (^|/)internal/controller/
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
