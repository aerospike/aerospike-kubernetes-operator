suite: webhook TLS provider modes

templates:
  - templates/aerospike-operator-selfsigned-issuer.yaml
  - templates/aerospike-operator-webhook-serving-cert.yaml
  - templates/aerospike-operator-webhook-selfsigned-secret.yaml
  - templates/aerospike-operator-validating-webhook-configuration.yaml
  - templates/aerospike-operator-mutating-webhook-configuration.yaml

tests:
  # ------------------------------------------------------------------------------
  # 4.5.0 backward compatibility: pin the resources and annotations 4.5.0 rendered on
  # each legacy path, so an upgrade does not change the cert wiring.
  # ------------------------------------------------------------------------------
  - it: "compat: provider unset + create=true renders the 4.5.0 cert-manager path"
    set:
      certs:
        webhook:
          create: true
    asserts:
      - hasDocuments:
          count: 1
        template: templates/aerospike-operator-selfsigned-issuer.yaml
      - hasDocuments:
          count: 1
        template: templates/aerospike-operator-webhook-serving-cert.yaml
      - hasDocuments:
          count: 0
        template: templates/aerospike-operator-webhook-selfsigned-secret.yaml
      - equal:
          path: metadata.annotations["cert-manager.io/inject-ca-from"]
          value: NAMESPACE/aerospike-operator-serving-cert
        template: templates/aerospike-operator-validating-webhook-configuration.yaml
      - equal:
          path: metadata.annotations["cert-manager.io/inject-ca-from"]
          value: NAMESPACE/aerospike-operator-serving-cert
        template: templates/aerospike-operator-mutating-webhook-configuration.yaml
      - notExists:
          path: webhooks[0].clientConfig.caBundle
        template: templates/aerospike-operator-validating-webhook-configuration.yaml
      - notExists:
          path: webhooks[0].clientConfig.caBundle
        template: templates/aerospike-operator-mutating-webhook-configuration.yaml

  # In 4.5.0 create=false skipped the Issuer/Certificate but still emitted the annotation:
  # it meant the user supplies the Certificate named aerospike-operator-serving-cert, not
  # that cert-manager is unused. `create` is read with plain truthiness, as 4.5.0 read it,
  # so a null key lands here too.
  - it: "compat: provider unset + create=false (or null) skips Issuer and Certificate but keeps the annotation"
    set:
      certs:
        webhook:
          create: false
    asserts:
      - hasDocuments:
          count: 0
        template: templates/aerospike-operator-selfsigned-issuer.yaml
      - hasDocuments:
          count: 0
        template: templates/aerospike-operator-webhook-serving-cert.yaml
      - hasDocuments:
          count: 0
        template: templates/aerospike-operator-webhook-selfsigned-secret.yaml
      - equal:
          path: metadata.annotations["cert-manager.io/inject-ca-from"]
          value: NAMESPACE/aerospike-operator-serving-cert
        template: templates/aerospike-operator-validating-webhook-configuration.yaml
      - equal:
          path: metadata.annotations["cert-manager.io/inject-ca-from"]
          value: NAMESPACE/aerospike-operator-serving-cert
        template: templates/aerospike-operator-mutating-webhook-configuration.yaml
      - notExists:
          path: webhooks[0].clientConfig.caBundle
        template: templates/aerospike-operator-validating-webhook-configuration.yaml

  # The Issuer is shared with the metrics certificate, so it must survive
  # webhook.create=false when metrics.create is true.
  - it: "compat: create=false + metrics.create=true still yields the shared Issuer"
    set:
      certs:
        webhook:
          create: false
        metrics:
          create: true
    asserts:
      - hasDocuments:
          count: 1
        template: templates/aerospike-operator-selfsigned-issuer.yaml
      - equal:
          path: metadata.name
          value: aerospike-operator-selfsigned-issuer
        template: templates/aerospike-operator-selfsigned-issuer.yaml
      - hasDocuments:
          count: 0
        template: templates/aerospike-operator-webhook-serving-cert.yaml

  # ------------------------------------------------------------------------------
  # Provider resolution
  # ------------------------------------------------------------------------------
  - it: "certManager: creates Issuer and Certificate, annotation, no caBundle"
    set:
      certs:
        webhook:
          provider: certManager
    asserts:
      - hasDocuments:
          count: 1
        template: templates/aerospike-operator-selfsigned-issuer.yaml
      - hasDocuments:
          count: 1
        template: templates/aerospike-operator-webhook-serving-cert.yaml
      - hasDocuments:
          count: 0
        template: templates/aerospike-operator-webhook-selfsigned-secret.yaml
      - exists:
          path: metadata.annotations["cert-manager.io/inject-ca-from"]
        template: templates/aerospike-operator-validating-webhook-configuration.yaml
      - notExists:
          path: webhooks[0].clientConfig.caBundle
        template: templates/aerospike-operator-validating-webhook-configuration.yaml

  # provider wins over a contradictory create. Adopting any provider changes behaviour
  # for an existing create=false user; this pins the certManager case.
  - it: "certManager: provider overrides a contradictory create=false"
    set:
      certs:
        webhook:
          provider: certManager
          create: false
    asserts:
      - hasDocuments:
          count: 1
        template: templates/aerospike-operator-webhook-serving-cert.yaml
      - equal:
          path: metadata.name
          value: aerospike-operator-serving-cert
        template: templates/aerospike-operator-webhook-serving-cert.yaml

  - it: "selfSigned: creates the Secret, no cert-manager resources, no annotation"
    set:
      certs:
        webhook:
          provider: selfSigned
    asserts:
      - hasDocuments:
          count: 0
        template: templates/aerospike-operator-selfsigned-issuer.yaml
      - hasDocuments:
          count: 0
        template: templates/aerospike-operator-webhook-serving-cert.yaml
      - hasDocuments:
          count: 1
        template: templates/aerospike-operator-webhook-selfsigned-secret.yaml
      - equal:
          path: type
          value: kubernetes.io/tls
        template: templates/aerospike-operator-webhook-selfsigned-secret.yaml
      - equal:
          path: metadata.name
          value: webhook-server-cert
        template: templates/aerospike-operator-webhook-selfsigned-secret.yaml
      - exists:
          path: data["tls.crt"]
        template: templates/aerospike-operator-webhook-selfsigned-secret.yaml
      - exists:
          path: data["tls.key"]
        template: templates/aerospike-operator-webhook-selfsigned-secret.yaml
      - exists:
          path: data["ca.crt"]
        template: templates/aerospike-operator-webhook-selfsigned-secret.yaml
      # cainjector would clobber the inlined bundle if cert-manager happens to be installed.
      - notExists:
          path: metadata.annotations["cert-manager.io/inject-ca-from"]
        template: templates/aerospike-operator-validating-webhook-configuration.yaml
      - notExists:
          path: metadata.annotations["cert-manager.io/inject-ca-from"]
        template: templates/aerospike-operator-mutating-webhook-configuration.yaml

  # The Issuer is shared, so selfSigned must not suppress it when metrics needs it.
  - it: "selfSigned: still yields the shared Issuer when metrics.create is true"
    set:
      certs:
        webhook:
          provider: selfSigned
        metrics:
          create: true
    asserts:
      - hasDocuments:
          count: 1
        template: templates/aerospike-operator-selfsigned-issuer.yaml

  - it: "external: creates nothing and inlines the supplied caBundle"
    set:
      certs:
        webhook:
          provider: external
          external:
            caBundle: "LS0tLS1CRUdJTg=="
    asserts:
      - hasDocuments:
          count: 0
        template: templates/aerospike-operator-selfsigned-issuer.yaml
      - hasDocuments:
          count: 0
        template: templates/aerospike-operator-webhook-serving-cert.yaml
      - hasDocuments:
          count: 0
        template: templates/aerospike-operator-webhook-selfsigned-secret.yaml
      - notExists:
          path: metadata.annotations["cert-manager.io/inject-ca-from"]
        template: templates/aerospike-operator-validating-webhook-configuration.yaml
      - equal:
          path: webhooks[0].clientConfig.caBundle
          value: "LS0tLS1CRUdJTg=="
        template: templates/aerospike-operator-validating-webhook-configuration.yaml

  # ------------------------------------------------------------------------------
  # caBundle is emitted per webhook entry, not once per configuration: each entry
  # carries its own `{{- with $caBundle }}` block. A new entry added without that
  # block would ship with no caBundle, so the entry counts are pinned here to fail
  # when one is added — 4 validating (5 with safePodEviction) and 2 mutating.
  # ------------------------------------------------------------------------------
  - it: "external: caBundle reaches every default validating entry"
    set:
      certs:
        webhook:
          provider: external
          external:
            caBundle: "LS0tLS1CRUdJTg=="
    template: templates/aerospike-operator-validating-webhook-configuration.yaml
    asserts:
      # lengthEqual guards the wildcard: an empty list would otherwise pass vacuously.
      - lengthEqual:
          path: webhooks
          count: 4
      - equal:
          path: webhooks[*].clientConfig.caBundle
          value: "LS0tLS1CRUdJTg=="

  - it: "external: caBundle reaches the eviction entry too"
    set:
      certs:
        webhook:
          provider: external
          external:
            caBundle: "LS0tLS1CRUdJTg=="
      safePodEviction:
        enable: true
        timeoutSeconds: 10
    template: templates/aerospike-operator-validating-webhook-configuration.yaml
    asserts:
      - lengthEqual:
          path: webhooks
          count: 5
      - equal:
          path: webhooks[*].clientConfig.caBundle
          value: "LS0tLS1CRUdJTg=="
      - equal:
          path: webhooks[4].name
          value: vaerospikeeviction.kb.io

  - it: "external: caBundle reaches both mutating entries"
    set:
      certs:
        webhook:
          provider: external
          external:
            caBundle: "LS0tLS1CRUdJTg=="
    template: templates/aerospike-operator-mutating-webhook-configuration.yaml
    asserts:
      - lengthEqual:
          path: webhooks
          count: 2
      - equal:
          path: webhooks[*].clientConfig.caBundle
          value: "LS0tLS1CRUdJTg=="

  # Whitespace is stripped so `--set-file` from a `base64` file works (the API server
  # decodes caBundle with strict base64 and would reject embedded newlines).
  - it: "external: wrapped and trailing whitespace is stripped from caBundle"
    set:
      certs:
        webhook:
          provider: external
          external:
            caBundle: "LS0tLS1C\nRUdJTg==\n"
    template: templates/aerospike-operator-validating-webhook-configuration.yaml
    asserts:
      - equal:
          path: webhooks[*].clientConfig.caBundle
          value: "LS0tLS1CRUdJTg=="

  # ------------------------------------------------------------------------------
  # selfSigned material is random per render, so these assert shape, not value: every
  # consumer gets a well-formed bundle. They all get the same one because every read
  # goes through ako.webhookSelfSignedCert, which memoizes into .Values.
  #
  # lookup returns empty with no cluster, so only the generate branch runs here.
  # ------------------------------------------------------------------------------
  - it: "selfSigned: every webhook entry and the Secret get a well-formed bundle"
    set:
      certs:
        webhook:
          provider: selfSigned
      safePodEviction:
        enable: true
        timeoutSeconds: 10
    asserts:
      - lengthEqual:
          path: webhooks
          count: 5
        template: templates/aerospike-operator-validating-webhook-configuration.yaml
      - matchRegex:
          path: webhooks[*].clientConfig.caBundle
          pattern: "^[A-Za-z0-9+/]+={0,2}$"
        template: templates/aerospike-operator-validating-webhook-configuration.yaml
      - lengthEqual:
          path: webhooks
          count: 2
        template: templates/aerospike-operator-mutating-webhook-configuration.yaml
      - matchRegex:
          path: webhooks[*].clientConfig.caBundle
          pattern: "^[A-Za-z0-9+/]+={0,2}$"
        template: templates/aerospike-operator-mutating-webhook-configuration.yaml
      - matchRegex:
          path: data["ca.crt"]
          pattern: "^[A-Za-z0-9+/]+={0,2}$"
        template: templates/aerospike-operator-webhook-selfsigned-secret.yaml
