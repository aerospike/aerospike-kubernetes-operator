suite: values.schema.json edge cases — image and registry

templates:
  - templates/aerospike-operator-controller-manager-deployment.yaml

tests:
  # -- aerospikeKubernetesInitRegistry --
  - it: accepts a non-empty aerospikeKubernetesInitRegistry
    set:
      aerospikeKubernetesInitRegistry: "my-registry.example.com"
    asserts:
      - notFailedTemplate: {}

  # 4.5.0 compatibility: an empty env var makes the operator fall back to its
  # built-in default init image registry and name/tag.
  - it: accepts a null aerospikeKubernetesInitRegistry
    set:
      aerospikeKubernetesInitRegistry: null
    asserts:
      - notFailedTemplate: {}

  - it: accepts a null aerospikeKubernetesInitNameTag
    set:
      aerospikeKubernetesInitNameTag: null
    asserts:
      - notFailedTemplate: {}

  # -- aerospikeKubernetesInitRegistryNamespace --
  - it: accepts a non-empty aerospikeKubernetesInitRegistryNamespace
    set:
      aerospikeKubernetesInitRegistryNamespace: "my-namespace"
    asserts:
      - notFailedTemplate: {}

  # -- operatorImage --
  - it: accepts a custom operatorImage.repository string
    set:
      operatorImage:
        repository: "my-org/my-operator"
    asserts:
      - notFailedTemplate: {}

  - it: rejects a non-string operatorImage.repository
    set:
      operatorImage:
        repository: 123
    asserts:
      - failedTemplate:
          errorPattern: "operatorImage/repository.*got number, want string"

  - it: accepts a custom operatorImage.tag string
    set:
      operatorImage:
        tag: "5.0.0"
    asserts:
      - notFailedTemplate: {}

  - it: accepts a numeric operatorImage.tag
    set:
      operatorImage:
        tag: 4.6
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: aerospike/aerospike-kubernetes-operator:4.6

  - it: accepts each valid operatorImage.pullPolicy
    set:
      operatorImage:
        pullPolicy: Never
    asserts:
      - notFailedTemplate: {}

  # -- imagePullSecrets --
  - it: accepts an empty imagePullSecrets array
    set:
      imagePullSecrets: []
    asserts:
      - notFailedTemplate: {}

  - it: accepts imagePullSecrets as a list of strings
    set:
      imagePullSecrets:
        - secret1
        - secret2
    asserts:
      - notFailedTemplate: {}

  - it: accepts imagePullSecrets as an object for backwards compatibility (deprecated, to be removed in a future major release)
    set:
      imagePullSecrets:
        secret_with_credentials_to_custom_registry: {}
    asserts:
      - notFailedTemplate: {}

  # 4.5.0 compatibility: the template's {{- with }} skips an empty string.
  - it: accepts an empty imagePullSecrets string
    set:
      imagePullSecrets: ""
    asserts:
      - notFailedTemplate: {}

  - it: rejects a non-array non-object imagePullSecrets value
    set:
      imagePullSecrets: "not-valid"
    asserts:
      - failedTemplate:
          errorPattern: "imagePullSecrets.*got string, want array"
