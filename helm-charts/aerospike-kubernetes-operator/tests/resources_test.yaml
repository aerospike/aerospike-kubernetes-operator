suite: values.schema.json edge cases — resources

templates:
  - templates/aerospike-operator-controller-manager-deployment.yaml

tests:
  - it: accepts a milli-cpu quantity string
    set:
      resources:
        limits:
          cpu: "400m"
    asserts:
      - notFailedTemplate: {}

  - it: accepts a bare numeric cpu value
    set:
      resources:
        limits:
          cpu: 400
    asserts:
      - notFailedTemplate: {}

  - it: rejects a bare zero numeric cpu value
    set:
      resources:
        limits:
          cpu: 0
    asserts:
      - failedTemplate:
          errorPattern: "resources/limits/cpu.*'anyOf' failed"

  - it: rejects a negative numeric memory value
    set:
      resources:
        requests:
          memory: -1
    asserts:
      - failedTemplate:
          errorPattern: "resources/requests/memory.*'anyOf' failed"

  - it: accepts a fractional cpu quantity string below 1 but above 0
    set:
      resources:
        requests:
          cpu: ".5"
    asserts:
      - notFailedTemplate: {}
