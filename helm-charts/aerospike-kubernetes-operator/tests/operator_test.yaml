suite: values.schema.json edge cases — operator runtime behavior

templates:
  - templates/aerospike-operator-controller-manager-deployment.yaml

tests:
  # -- replicas --
  - it: accepts replicas of 0 (scale down is allowed)
    set:
      replicas: 0
    asserts:
      - notFailedTemplate: {}

  - it: accepts a typical replicas value
    set:
      replicas: 2
    asserts:
      - notFailedTemplate: {}

  - it: accepts replicas as a numeric string
    set:
      replicas: "3"
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  # -- failedPodGracePeriodSeconds --
  - it: accepts failedPodGracePeriodSeconds as a numeric string
    set:
      failedPodGracePeriodSeconds: "60"
    asserts:
      - notFailedTemplate: {}

  - it: accepts failedPodGracePeriodSeconds as a bare integer
    set:
      failedPodGracePeriodSeconds: 60
    asserts:
      - notFailedTemplate: {}

  # -- watchNamespaces --
  - it: accepts an empty watchNamespaces (cluster-wide)
    set:
      watchNamespaces: ""
    asserts:
      - notFailedTemplate: {}

  - it: accepts a single-namespace watchNamespaces
    set:
      watchNamespaces: "aerospike"
    asserts:
      - notFailedTemplate: {}

  - it: accepts a comma-joined multi-namespace watchNamespaces
    set:
      watchNamespaces: "default,aerospike"
    asserts:
      - notFailedTemplate: {}

  - it: accepts watchNamespaces with spaces around commas
    set:
      watchNamespaces: " default , aerospike "
    asserts:
      - notFailedTemplate: {}

  # -- ignoreNamespaces --
  - it: accepts a comma-joined multi-namespace ignoreNamespaces
    set:
      ignoreNamespaces: "kube-system,kube-node-lease"
    asserts:
      - notFailedTemplate: {}

  - it: accepts ignoreNamespaces with spaces around commas
    set:
      ignoreNamespaces: "kube-system, kube-node-lease"
    asserts:
      - notFailedTemplate: {}

  # -- safePodEviction --
  - it: accepts safePodEviction.enable as a boolean
    set:
      safePodEviction:
        enable: true
    asserts:
      - notFailedTemplate: {}

  # 4.5.0 compatibility: a null enable leaves the eviction webhook off, and a null
  # timeoutSeconds renders an empty value so Kubernetes applies its default (10s).
  - it: accepts a null safePodEviction.enable
    set:
      safePodEviction:
        enable: null
    asserts:
      - notFailedTemplate: {}

  - it: accepts a null safePodEviction.timeoutSeconds when enable is true
    set:
      safePodEviction:
        enable: true
        timeoutSeconds: null
    asserts:
      - notFailedTemplate: {}

  # -- logging --
  - it: accepts logging.development as a boolean
    set:
      logging:
        development: false
    asserts:
      - notFailedTemplate: {}

  - it: accepts logging.level as one of the fixed strings
    set:
      logging:
        level: "debug"
    asserts:
      - notFailedTemplate: {}

  - it: accepts logging.level as a bare positive integer
    set:
      logging:
        level: 5
    asserts:
      - notFailedTemplate: {}

  # Zap lowercases the level and Atoi's numeric strings, so these all start the operator.
  - it: accepts logging.level in any case
    set:
      logging:
        level: "DEBUG"
    asserts:
      - notFailedTemplate: {}

  - it: accepts logging.level as a positive integer string
    set:
      logging:
        level: "1"
    asserts:
      - notFailedTemplate: {}

  - it: accepts logging.level as an integer 0 and leaves the flag off
    set:
      logging:
        level: 0
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --zap-log-level=0

  # --zap-devel is parsed by strconv.ParseBool.
  - it: accepts logging.development in any form strconv.ParseBool accepts
    set:
      logging:
        development: "True"
    asserts:
      - notFailedTemplate: {}

  - it: accepts each valid logging.encoder
    set:
      logging:
        encoder: console
    asserts:
      - notFailedTemplate: {}

  # Zap lowercases the encoder, so any casing starts the operator.
  - it: accepts logging.encoder in any case
    set:
      logging:
        encoder: "JSON"
    asserts:
      - notFailedTemplate: {}

  # -- rbac --
  # An empty rbac map passes because Helm merges it with the chart default
  # (create: true) before validation.
  - it: accepts rbac.create being entirely absent
    set:
      rbac: {}
    asserts:
      - notFailedTemplate: {}

  - it: accepts rbac.create true without a serviceAccountName
    set:
      rbac:
        create: true
    asserts:
      - notFailedTemplate: {}

  # -- extraEnv --
  - it: accepts an extraEnv key starting with underscore
    set:
      extraEnv:
        _FOO: "bar"
    asserts:
      - notFailedTemplate: {}

  - it: accepts an extraEnv key starting with character
    set:
      extraEnv:
        "FOO": "bar"
    asserts:
      - notFailedTemplate: {}

  - it: renders a numeric extraEnv value as a string
    set:
      extraEnv:
        FOO: 123
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "FOO")].value
          value: "123"

  - it: renders a boolean extraEnv value as a string
    set:
      extraEnv:
        FOO: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "FOO")].value
          value: "true"

  # 4.5.0 had no schema and rendered a null extraEnv value as an empty string.
  - it: renders a null extraEnv value as an empty string
    set:
      extraEnv:
        FOO: null
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "FOO")].value
          value: ""

  # 4.5.0 compatibility: the template's {{- if .Values.extraEnv }} skips an empty
  # list or empty string.
  - it: accepts an empty extraEnv list
    set:
      extraEnv: []
    asserts:
      - notFailedTemplate: {}

  - it: rejects a non-empty extraEnv string
    set:
      extraEnv: "FOO=bar"
    asserts:
      - failedTemplate:
          errorPattern: "at '/extraEnv': 'anyOf' failed"
