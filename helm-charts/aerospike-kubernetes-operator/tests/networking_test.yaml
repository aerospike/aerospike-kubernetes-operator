suite: values.schema.json edge cases — networking (ports and services)

templates:
  - templates/aerospike-operator-controller-manager-deployment.yaml

tests:
  # -- healthPort --
  - it: accepts healthPort as a numeric string
    set:
      healthPort: "8081"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: 8081

  # -- metricsService --
  - it: accepts each valid metricsService.type
    set:
      metricsService:
        type: LoadBalancer
    asserts:
      - notFailedTemplate: {}

  # -- webhookService --
  - it: accepts webhookService.targetPort as a numeric string
    set:
      webhookService:
        targetPort: "9443"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[?(@.name == "webhook-server")].containerPort
          value: 9443

  - it: accepts each valid webhookService.type
    set:
      webhookService:
        type: NodePort
    asserts:
      - notFailedTemplate: {}
