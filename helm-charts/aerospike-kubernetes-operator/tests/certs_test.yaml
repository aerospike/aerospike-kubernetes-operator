suite: values.schema.json edge cases — certs

templates:
  - templates/aerospike-operator-controller-manager-deployment.yaml

tests:
  # -- parent-object presence --
  # The provider resolver dereferences .Values.certs.webhook, and the metrics templates
  # dereference .Values.certs.metrics.create, both with no nil guard, so nulling out a
  # parent must fail schema validation rather than crashing the renderer with
  # "nil pointer evaluating interface {}.webhook".
  - it: rejects certs being nulled out entirely
    set:
      certs: null
    asserts:
      - failedTemplate:
          errorPattern: "missing propert(y|ies) 'certs'"

  - it: rejects certs.webhook being nulled out
    set:
      certs:
        webhook: null
    asserts:
      - failedTemplate:
          errorPattern: "at '/certs': missing propert(y|ies) 'webhook'"

  - it: rejects certs.metrics being nulled out
    set:
      certs:
        metrics: null
    asserts:
      - failedTemplate:
          errorPattern: "at '/certs': missing propert(y|ies) 'metrics'"

  # -- certs.webhook.create / certs.metrics.create --
  - it: accepts certs.webhook.create as a boolean
    set:
      certs:
        webhook:
          create: false
    asserts:
      - notFailedTemplate: {}

  - it: rejects certs.webhook.create as a string
    set:
      certs:
        webhook:
          create: "true"
    asserts:
      - failedTemplate:
          errorPattern: "certs/webhook/create.*got string, want boolean"

  - it: accepts certs.metrics.create as a boolean
    set:
      certs:
        metrics:
          create: true
    asserts:
      - notFailedTemplate: {}

  # metricsServerCertSecretName is only referenced by the template when
  # certs.metrics.create is true.
  # Gates the metrics-certs volume behind {{- if .Values.certs.metrics.create }}), so the
  # schema only requires it non-empty conditionally, via an if/then on certs.metrics.
  - it: accepts a non-empty metricsServerCertSecretName when metrics.create is true
    set:
      certs:
        metrics:
          create: true
          metricsServerCertSecretName: "x"
    asserts:
      - notFailedTemplate: {}

  - it: rejects an empty metricsServerCertSecretName when metrics.create is true
    set:
      certs:
        metrics:
          create: true
          metricsServerCertSecretName: ""
    asserts:
      - failedTemplate:
          errorPattern: "at '/certs/metrics/metricsServerCertSecretName': minLength: got 0, want 1"

  - it: accepts an empty metricsServerCertSecretName when metrics.create is false (unused by the template)
    set:
      certs:
        metrics:
          create: false
          metricsServerCertSecretName: ""
    asserts:
      - notFailedTemplate: {}

  # webhook certs are mandatory for AKO to function (unlike metrics TLS, which is
  # optional) — the webhook-certs volume is always mounted with no {{- if }} guard,
  # so webhookServerCertSecretName is required non-empty unconditionally. It names the
  # Secret every provider uses: created by cert-manager, generated by the chart, or
  # supplied by the user.
  - it: accepts a non-empty webhookServerCertSecretName when webhook.create is true
    set:
      certs:
        webhook:
          create: true
          webhookServerCertSecretName: "x"
    asserts:
      - notFailedTemplate: {}

  - it: rejects an empty webhookServerCertSecretName when webhook.create is true
    set:
      certs:
        webhook:
          create: true
          webhookServerCertSecretName: ""
    asserts:
      - failedTemplate:
          errorPattern: "at '/certs/webhook/webhookServerCertSecretName': minLength: got 0, want 1"

  - it: accepts a non-empty webhookServerCertSecretName when webhook.create is false
    set:
      certs:
        webhook:
          create: false
          webhookServerCertSecretName: "x"
    asserts:
      - notFailedTemplate: {}

  - it: rejects an empty webhookServerCertSecretName even when webhook.create is false (user must supply the secret externally)
    set:
      certs:
        webhook:
          create: false
          webhookServerCertSecretName: ""
    asserts:
      - failedTemplate:
          errorPattern: "at '/certs/webhook/webhookServerCertSecretName': minLength: got 0, want 1"

  # -- certs.webhook.provider --
  # provider is the single source of truth for the webhook TLS mode. create is kept
  # only as a legacy fallback and is no longer a required key.
  - it: accepts an empty provider (infers the mode from create)
    set:
      certs:
        webhook:
          provider: ""
    asserts:
      - notFailedTemplate: {}

  - it: accepts provider certManager
    set:
      certs:
        webhook:
          provider: certManager
    asserts:
      - notFailedTemplate: {}

  - it: accepts provider selfSigned
    set:
      certs:
        webhook:
          provider: selfSigned
    asserts:
      - notFailedTemplate: {}

  - it: accepts provider external when caBundle is supplied
    set:
      certs:
        webhook:
          provider: external
          external:
            caBundle: "LS0tLS1CRUdJTg=="
    asserts:
      - notFailedTemplate: {}

  - it: rejects an unknown provider value
    set:
      certs:
        webhook:
          provider: letsencrypt
    asserts:
      - failedTemplate:
          errorPattern: "at '/certs/webhook/provider': value must be one of"

  - it: accepts certs.webhook.create being absent (no longer required)
    set:
      certs:
        webhook:
          provider: certManager
          create: null
    asserts:
      - notFailedTemplate: {}

  # -- certs.webhook.external.caBundle --
  # Only required when provider is external, via an if/then on the certs.webhook object.
  - it: requires external.caBundle when provider is external
    set:
      certs:
        webhook:
          provider: external
    asserts:
      - failedTemplate:
          errorPattern: "at '/certs/webhook': 'allOf' failed"

  - it: rejects an empty external.caBundle when provider is external
    set:
      certs:
        webhook:
          provider: external
          external:
            caBundle: ""
    asserts:
      - failedTemplate:
          errorPattern: "at '/certs/webhook': 'allOf' failed"

  - it: accepts single-line base64 for external.caBundle
    set:
      certs:
        webhook:
          provider: external
          external:
            caBundle: "LS0tLS1CRUdJTg=="
    asserts:
      - notFailedTemplate: {}

  # Raw PEM instead of base64 is the most common mistake here. The API server decodes
  # caBundle with strict base64, so newlines are rejected too.
  - it: rejects raw PEM in external.caBundle
    set:
      certs:
        webhook:
          provider: external
          external:
            caBundle: "-----BEGIN CERTIFICATE-----"
    asserts:
      - failedTemplate:
          errorPattern: "at '/certs/webhook/external/caBundle': .* does not match pattern"

  # Whitespace is accepted and stripped at render time, so `--set-file` from a file
  # produced by `base64` (trailing newline, possibly wrapped at 76 columns) works.
  - it: accepts wrapped base64 with a trailing newline in external.caBundle
    set:
      certs:
        webhook:
          provider: external
          external:
            caBundle: "LS0tLS1C\nRUdJTg==\n"
    asserts:
      - notFailedTemplate: {}

  # certManager/selfSigned are deliberately reserved empty extension points, closed so a
  # typo is rejected rather than silently ignored.
  - it: rejects unknown keys under certs.webhook.certManager
    set:
      certs:
        webhook:
          certManager:
            duration: 24h
    asserts:
      - failedTemplate:
          errorPattern: "at '/certs/webhook/certManager': additional properties"

  - it: rejects unknown keys under certs.webhook.selfSigned
    set:
      certs:
        webhook:
          selfSigned:
            duration: 24h
    asserts:
      - failedTemplate:
          errorPattern: "at '/certs/webhook/selfSigned': additional properties"

  - it: rejects unknown keys under certs.webhook.external
    set:
      certs:
        webhook:
          external:
            bogus: x
    asserts:
      - failedTemplate:
          errorPattern: "at '/certs/webhook/external': additional properties"

  # -- metrics.secure --
  - it: accepts metrics.secure as a boolean
    set:
      metrics:
        secure: false
    asserts:
      - notFailedTemplate: {}
