# Default values for Aerospike Kubernetes Operator.

# -- (Optional) Override the chart name used in generated resource names
nameOverride: "" # @schema nullable

# -- (Optional) Override the fully qualified name used for generated resource names
fullnameOverride: "" # @schema nullable

# -- Number of operator replicas to deploy
replicas: 2 # @schema anyOf: [{type: integer}, {type: string}, {type: "null"}]

# -- Operator image
operatorImage: # @schema required; additionalProperties: false
  repository: aerospike/aerospike-kubernetes-operator # @schema required; minLength: 1
  tag: 4.6.0-dev1 # @schema required; type: [string, number]; minLength: 1
  pullPolicy: IfNotPresent # @schema nullable

# -- In case the above image is pulled from a registry that requires
# authentication, a secret containing credentials can be added
# imagePullSecrets:
#   - secret_with_credentials_to_custom_registry
imagePullSecrets: [] # @schema anyOf: [{type: array}, {type: object}, {type: "null"}]

# -- RBAC resource creation for the operator
rbac: # @schema required
  # -- Create RBAC resources and a service account for the operator
  create: true # @schema type: [boolean, string, "null"]
  # -- Name of an existing service account to use when rbac.create is false
  # serviceAccountName: "default"

# -- Port for the operator's health probe bind address
healthPort: 8081 # @schema required; anyOf: [{type: string}, {type: integer}]

# -- Port for the operator's metrics bind address
metricsPort: 8443 # @schema required; anyOf: [{type: string}, {type: integer}]

# -- Certificate configuration for the webhook and metrics endpoints
certs: # @schema required
  # @schema allOf: [{type: object}, {if: {properties: {provider: {const: external}}, required: [provider]}, then: {required: [external], properties: {external: {required: [caBundle], properties: {caBundle: {minLength: 1}}}}}}]
  # @schema additionalProperties: false
  # -- Webhook server certificate configuration
  webhook: # @schema required
    # -- How the webhook serving certificate is provided.
    # certManager: chart creates the cert-manager Issuer/Certificate (requires cert-manager).
    # selfSigned: chart generates the cert and Secret itself. Dev/POC only, see README.
    # external: you pre-create the Secret and supply external.caBundle.
    # Empty infers the mode from the deprecated `create` flag (4.5.0 compatibility).
    provider: "" # @schema enum: ["", certManager, selfSigned, external]

    # -- DEPRECATED: use `provider` instead. Only consulted when `provider` is empty.
    # Will be removed in a future release.
    create: true # @schema type: [boolean, string, "null"]

    # -- Name of the secret holding the webhook server certificate
    webhookServerCertSecretName: "webhook-server-cert" # @schema required; minLength: 1

    # -- Reserved for future cert-manager tuning (issuerRef, duration, renewBefore)
    certManager: {} # @schema additionalProperties: false

    # -- Reserved for future self-signed tuning (duration). Dev/POC only
    selfSigned: {} # @schema additionalProperties: false

    external: # @schema additionalProperties: false
      # -- Base64-encoded PEM CA bundle that signed the webhook serving certificate
      # (not the serving certificate itself). Required when provider is external.
      # Surrounding and embedded whitespace is stripped before rendering, so wrapped
      # output and a trailing newline are fine — reading it from a `base64` file works.
      # A whitespace-only value is rejected: it would strip to empty and silently render
      # a webhook config with no caBundle.
      caBundle: "" # @schema pattern:^(|\s*[A-Za-z0-9+/][A-Za-z0-9+/\s]*={0,2}\s*)$

  # @schema allOf: [{type: object}, {if: {properties: {create: {const: true}}, required: [create]}, then: {properties: {metricsServerCertSecretName: {minLength: 1}}, required: [metricsServerCertSecretName]}}]
  # @schema additionalProperties: false
  # -- Metrics server certificate configuration
  metrics: # @schema required
    create: false # @schema type: [boolean, string, "null"]
    # -- Name of the secret holding the metrics server certificate
    metricsServerCertSecretName: "metrics-server-cert" # @schema type: [string, "null"]

# -- Operator manager logging (controller-runtime / Zap).
# `development` must stay set; level/encoder are optional (set them in values or on the CLI).
logging: # @schema required
  development: true # @schema required; anyOf: [{type: boolean}, {type: string}]
  # -- (Optional) Zap log level (--zap-log-level): debug, info, error, panic (any case), or a positive integer for custom verbosity. Empty (or 0) leaves the flag off
  # level: ""
  # -- (Optional) Zap log encoder (--zap-encoder): json or console (any case). Empty leaves the flag off
  # encoder: ""

# -- Operator manager /metrics endpoint configuration
# Always passed in the Deployment args for clarity; defaults to TLS on (`true`).
metrics: # @schema required; additionalProperties: false
  secure: true # @schema required; anyOf: [{type: boolean}, {type: string}]

# -- Comma-separated list of namespaces to watch for Aerospike custom resources
watchNamespaces: "default,aerospike" # @schema type: [string, "null"]

# -- Comma-separated list of namespaces to ignore. Only used for eviction webhook
ignoreNamespaces: "kube-system,kube-node-lease" # @schema type: [string, "null"]

# @schema additionalProperties: false
# -- Enable the eviction webhook to safely block Aerospike pod evictions during node maintenance
# Also enables Prometheus metrics: aerospike_ako_eviction_webhook_requests_total (labels: eviction_namespace, decision)
safePodEviction: # @schema required
  enable: false # @schema type: [boolean, string, "null"]
  timeoutSeconds: "20" # @schema type: [string, number, "null"]

# -- Grace period to delete/recover failed pods (in seconds)
failedPodGracePeriodSeconds: "60" # @schema type: [string, number, "null"]

# -- Registry used to pull aerospike-init image
aerospikeKubernetesInitRegistry: "docker.io" # @schema nullable

# -- Namespace in registry used to pull aerospike-init image
aerospikeKubernetesInitRegistryNamespace: "aerospike" # @schema nullable

# -- Name and tag of aerospike-init image
aerospikeKubernetesInitNameTag: "aerospike-kubernetes-init:2.5.4-dev1" # @schema nullable

# -- Resources - limits / requests
resources: # @schema hidden
  limits:
    cpu: 400m
    memory: 512Mi
  requests:
    cpu: 10m
    memory: 64Mi

# -- Affinity rules
affinity: {} # @schema hidden
# nodeAffinity:
#   requiredDuringSchedulingIgnoredDuringExecution:
#     nodeSelectorTerms:
#     - matchExpressions:
#       - key: kubernetes.io/hostname
#         operator: In
#         values:
#         - <Kubernetes Host>

# @schema anyOf: [{type: [object, "null"]}, {type: array}]
# -- Extra environment variables that will be passed into the operator pods
extraEnv: {}

# -- Node selector
nodeSelector: {} # @schema hidden

# -- Tolerations
tolerations: [] # @schema hidden

# -- Deployment annotations
annotations: {} # @schema hidden

# -- Deployment labels are inherited by the pods automatically
labels: {} # @schema hidden

# -- Pod annotations
podAnnotations: {} # @schema hidden

# -- Pod labels
podLabels: {} # @schema hidden

# -- Service configuration
metricsService: # @schema required
  port: 8443 # @schema required; anyOf: [{type: string}, {type: integer}]
  type: ClusterIP # @schema nullable
  # -- (Optional) Extra labels for the service
  # labels: {}
  # -- (Optional) Extra annotations for the service
  # annotations: {}

# -- Service configuration
webhookService: # @schema required
  port: 443 # @schema required; anyOf: [{type: string}, {type: integer}]
  targetPort: 9443 # @schema required; anyOf: [{type: string}, {type: integer}]
  # -- Kubernetes Service type
  type: ClusterIP # @schema nullable
  # -- (Optional) Extra labels for the service
  # labels: {}
  # -- (Optional) Extra annotations for the service
  # annotations: {}

# -- Pod security context
podSecurityContext: {} # @schema hidden

# -- Container security context
securityContext: # @schema hidden
  allowPrivilegeEscalation: false

# -- Liveness probe configuration
livenessProbe: # @schema hidden
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 1
  successThreshold: 1
  failureThreshold: 3

# -- Readiness probe configuration
readinessProbe: # @schema hidden
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 1
  successThreshold: 1
  failureThreshold: 3
