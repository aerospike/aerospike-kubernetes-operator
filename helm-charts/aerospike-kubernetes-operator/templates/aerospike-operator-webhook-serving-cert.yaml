{{- if include "aerospike-kubernetes-operator.webhookCreateCertManagerResources" . }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: aerospike-operator-serving-cert
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ template "aerospike-kubernetes-operator.fullname" . }}
    chart: {{ .Chart.Name }}
    release: {{ .Release.Name }}
spec:
  dnsNames:
{{- include "aerospike-kubernetes-operator.webhookDnsNames" . | nindent 2 }}
  issuerRef:
    kind: Issuer
    name: aerospike-operator-selfsigned-issuer
  secretName: {{ .Values.certs.webhook.webhookServerCertSecretName }}
{{- end }}
