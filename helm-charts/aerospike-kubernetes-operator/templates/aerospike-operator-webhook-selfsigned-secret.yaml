{{/*
Webhook serving certificate for certs.webhook.provider=selfSigned — the chart generates
the CA and leaf itself instead of relying on cert-manager. Dev/POC only; see the README.
The Deployment mounts this Secret by certs.webhook.webhookServerCertSecretName, which is
the same name every other provider uses, so no Deployment change is needed.
*/}}
{{- if eq (include "aerospike-kubernetes-operator.webhookCertProvider" .) "selfSigned" }}
{{- $cert := include "aerospike-kubernetes-operator.webhookSelfSignedCert" . | fromYaml }}
apiVersion: v1
kind: Secret
type: kubernetes.io/tls
metadata:
  name: {{ .Values.certs.webhook.webhookServerCertSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ template "aerospike-kubernetes-operator.fullname" . }}
    chart: {{ .Chart.Name }}
    release: {{ .Release.Name }}
data:
  tls.crt: {{ $cert.crt }}
  tls.key: {{ $cert.key }}
  ca.crt: {{ $cert.ca }}
{{- end }}
