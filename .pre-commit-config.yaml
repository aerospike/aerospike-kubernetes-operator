repos:
  - repo: https://github.com/tekwizely/pre-commit-golang
    rev: v1.0.0-rc.1
    hooks:
      - id: go-mod-tidy

  - repo: https://github.com/golangci/golangci-lint
    rev: v1.52.2
    hooks:
      - id: golangci-lint
        args:
          - --config=.golangci.yml

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.16.3
    hooks:
      - id: gitleaks
  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: shellcheck

  # Regenerates values.schema.json for aerospike-kubernetes-operator chart.
  # Requires the helm plugin losisin/helm-values/schema-json.
  # Install cmd: helm plugin install https://github.com/losisin/helm-values-schema-json --version v3.1.0
  - repo: local
    hooks:
      - id: helm-schema-aerospike-kubernetes-operator
        name: Generate values.schema.json (aerospike-kubernetes-operator)
        language: system
        pass_filenames: false
        files: ^helm-charts/aerospike-kubernetes-operator/(values\.yaml|\.schema\.yaml)$
        entry: sh -c 'cd helm-charts/aerospike-kubernetes-operator && helm schema'
