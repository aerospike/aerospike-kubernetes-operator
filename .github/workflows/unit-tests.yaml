name: unit tests

on:
  push:
    branches:
      - master
    paths:
      - 'pkg/**'
      - 'internal/**'
      - '.github/workflows/pkg-unit-tests.yaml'
  pull_request:
    branches:
      - master
    paths:
      - 'pkg/**'
      - 'internal/**'
      - '.github/workflows/pkg-unit-tests.yaml'

jobs:
  run-unit-tests:
    name: run-unit-tests
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: make unit-test

