name: Eviction Webhook ENV Test Suite

on:
  push:
    tags:
      - v*
    branches:
      - master
  workflow_dispatch: # Allows manual triggering
  pull_request:
    branches:
      - master
      - "enhancement/**"
      - "bugfix/**"
    paths: # Only run on PRs when eviction webhook or cluster-related code or tests change
      - "internal/webhook/**"
      - "api/v1/**"
      - "test/envtests/**"
      - ".github/workflows/webhook-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        k8s-version: ["1.37", "1.23"]
    name: EnvTest (k8s ${{ matrix.k8s-version }})
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Setup-go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # Install Ginkgo CLI (so `go run` not needed)
      - name: Install Ginkgo CLI
        run: go install github.com/onsi/ginkgo/v2/ginkgo@latest

      # Run your env-test target
      - name: Run EnvTest Suite
        run: make env-test ENVTEST_K8S_VERSION=${{ matrix.k8s-version }}
