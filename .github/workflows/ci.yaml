# CI for pull requests, master and the scheduled run. Replaces the Jenkins job.
#
#   prepare -> operator image -> OLM bundle -> bundle image -> scan -> e2e -> release bundle -> promote to DEV
#   operator image -> helm charts -> release bundle
#
# Images and charts go to JFrog first, because the e2e tests install the
# operator from there. The release bundle is created only after the scan and
# the e2e tests pass, so every bundle in DEV is a build that passed CI.
#
# Secrets:   SNYK_TOKEN, AKO_FEATURES_CONF_B64
# Variables: GKE_WIF_PROVIDER, GKE_SERVICE_ACCOUNT, GKE_PROJECT, GKE_LOCATION,
#            GKE_CLUSTER, AWS_ECR_ROLE_ARN

name: CI

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    # 20:00 UTC every 2 days (odd days of the month)
    - cron: "0 20 */2 * *"
  workflow_dispatch:

permissions: {}

# A new push to a PR cancels its previous run. Other runs are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

# Read by setup-jfrog-cli
env:
  JF_PROJECT: platforms
  JF_URL: https://artifact.aerospike.io

jobs:
  prepare:
    name: Prepare
    # Fork PRs get no secrets or OIDC token, so nothing below can run for them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      base-version: ${{ steps.version.outputs.base-version }}
      version: ${{ steps.version.outputs.version }}
      suites: ${{ steps.tests.outputs.suites }}
      focus: ${{ steps.tests.outputs.focus }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      # e.g. 4.6.0-pr-620-a1b2c3d, 4.6.0-master-e4f5a6b, 4.6.0-scheduled-e4f5a6b.
      # The short commit SHA ties every version, and so every release bundle, to
      # the commit it was built from. For a PR it is the PR's head commit.
      - name: Compute version
        id: version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base=$(sed -n 's/^VERSION ?= *//p' Makefile)
          case "$GITHUB_EVENT_NAME" in
            pull_request) label="pr-$PR_NUMBER" ;;
            schedule) label="scheduled" ;;
            *) label=$(echo "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g') ;;
          esac
          echo "base-version=$base" >> "$GITHUB_OUTPUT"
          echo "version=$base-$label-${SHA::7}" | tee -a "$GITHUB_OUTPUT"

      - name: Select e2e tests
        id: tests
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --name-only "origin/$BASE_REF...HEAD" | hack/ci/select-tests.sh
          else
            hack/ci/select-tests.sh all
          fi | tee -a "$GITHUB_OUTPUT"

      # The shared docker workflow checks out without submodules, and the
      # operator embeds pkg/configschema/schemas. Hand it the schemas instead.
      - name: Upload config schemas
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: config-schemas
          path: pkg/configschema/schemas/json/aerospike
          if-no-files-found: error
          retention-days: 1

  operator-image:
    name: Operator image
    needs: prepare
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: aerospike/shared-workflows/.github/workflows/reusable_docker-build-deploy.yaml@b4b1e9dc89314a2d542f9d6fe0ee150ad06f9860 # v5.0.0
    with:
      jf-project: platforms
      image-name: aerospike-kubernetes-operator
      app-version: ${{ needs.prepare.outputs.version }}
      jf-build-name: ako-operator
      build-args-json: '{"VERSION": "${{ needs.prepare.outputs.base-version }}"}'
      gh-context-artifacts-json: '[{"name": "config-schemas", "dest": "pkg/configschema/schemas/json/aerospike"}]'

  helm-charts:
    name: Helm charts
    needs: [prepare, operator-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      OPERATOR_IMG: ${{ needs.operator-image.outputs.immutable-tag }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JFrog CLI
        uses: step-security/setup-jfrog-cli@53aeacb709fce45d0baf69a13ec3342f7e2d71a9 # v5.1.0
        with:
          oidc-provider-name: gh-aerospike
          oidc-audience: aerospike

      # The DEV operator chart deploys the operator image built in this run.
      # TODO: Decide if we want this. Without it, the chart keeps the original
      # image.
      - name: Set operator image
        run: |
          export REPO="${OPERATOR_IMG%:*}" TAG="${OPERATOR_IMG##*:}"
          yq -i '.operatorImage.repository = strenv(REPO) | .operatorImage.tag = strenv(TAG)' \
            helm-charts/aerospike-kubernetes-operator/values.yaml

      - name: Package charts
        run: |
          for chart in helm-charts/*/; do
            helm package "$chart" --version "$VERSION" --destination dist
          done

      # Same layout as the shared deploy workflow: <chart>/<version>/<chart>-<version>.tgz.
      # --flat stops the local dist/ folder from becoming part of the path.
      - name: Upload charts to JFrog
        run: |
          jf rt upload "dist/(*)-${VERSION}.tgz" "platforms-helm-dev-local/{1}/${VERSION}/" --flat \
            --build-name=ako-helm-charts --build-number="$GITHUB_RUN_NUMBER" --project=platforms
          jf rt build-publish ako-helm-charts "$GITHUB_RUN_NUMBER" --project=platforms

  olm-bundle:
    name: OLM bundle manifests
    needs: [prepare, operator-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Generate bundle
        env:
          IMG: ${{ needs.operator-image.outputs.immutable-tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          make bundle IMG="$IMG" VERSION="$VERSION"
          mkdir -p ci-olm
          cp bundle.Dockerfile ci-olm/

      - name: Upload bundle manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: olm-bundle
          path: bundle/
          if-no-files-found: error
          retention-days: 1

      - name: Upload bundle Dockerfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: olm-bundle-dockerfile
          path: ci-olm/bundle.Dockerfile
          if-no-files-found: error
          retention-days: 1

  bundle-image:
    name: OLM bundle image
    needs: [prepare, olm-bundle]
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: aerospike/shared-workflows/.github/workflows/reusable_docker-build-deploy.yaml@b4b1e9dc89314a2d542f9d6fe0ee150ad06f9860 # v5.0.0
    with:
      jf-project: platforms
      image-name: aerospike-kubernetes-operator-bundle
      app-version: ${{ needs.prepare.outputs.version }}
      jf-build-name: ako-olm-bundle
      platforms: linux/amd64
      # Same as the plain `docker build` used for bundles so far
      provenance: "false"
      sbom: false
      # Relative to the workspace, not the context
      file: ci-olm/bundle.Dockerfile
      gh-context-artifacts-json: '[{"name": "olm-bundle", "dest": "bundle"}, {"name": "olm-bundle-dockerfile", "dest": "ci-olm"}]'

  scan:
    name: Vulnerability scan
    needs: [operator-image, bundle-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      OPERATOR_IMG: ${{ needs.operator-image.outputs.immutable-tag }}
      BUNDLE_IMG: ${{ needs.bundle-image.outputs.immutable-tag }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up JFrog CLI
        id: jf
        uses: step-security/setup-jfrog-cli@53aeacb709fce45d0baf69a13ec3342f7e2d71a9 # v5.1.0
        with:
          oidc-provider-name: gh-aerospike
          oidc-audience: aerospike

      - name: Login to JFrog
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: artifact.aerospike.io
          username: ${{ steps.jf.outputs.oidc-user }}
          password: ${{ steps.jf.outputs.oidc-token }}

      - name: Set up Snyk
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04

      # Same commands and thresholds as the Jenkins job
      - name: Scan dependencies
        run: snyk test --severity-threshold=high --fail-on=all

      - name: Scan operator image
        run: |
          docker pull "$OPERATOR_IMG"
          snyk container test "$OPERATOR_IMG" --severity-threshold=high --file=Dockerfile --policy-path=.snyk --fail-on=all

      - name: Scan bundle image
        run: |
          docker pull "$BUNDLE_IMG"
          snyk container test "$BUNDLE_IMG" --severity-threshold=high --file=Dockerfile --policy-path=.snyk --fail-on=all

