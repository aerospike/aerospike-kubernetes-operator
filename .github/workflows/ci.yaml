# CI for pull requests, master and the nightly run. Replaces the Jenkins job.
#
#   prepare -> operator image -> OLM bundle -> bundle image -> scan -> e2e -> release bundle -> promote to DEV
#   operator image -> helm charts -> release bundle
#   OLM bundle -> release bundle (the OLM bundle job also uploads the manifests to the generic repo)
#
# Images and charts go to JFrog first, because the e2e tests install the
# operator from there. The release bundle is created only after the scan and
# the e2e tests pass, so every bundle in DEV is a build that passed CI.
#
# The nightly run only builds, pushes and tests the images. It skips the helm
# charts, the OLM manifests upload and the release bundle.
#
# Secrets: SNYK_TOKEN, AKO_FEATURES_CONF_B64, GKE_WIF_PROVIDER, GKE_SERVICE_ACCOUNT,
#          GKE_PROJECT, GKE_LOCATION, GKE_CLUSTER, AWS_S3_ROLE_ARN

name: CI

on:
  pull_request:
  push:
    branches:
      - master
  # Nightly run: 20:00 UTC every 2 days (odd days of the month)
  schedule:
    - cron: "0 20 */2 * *"
  workflow_dispatch:

permissions: {}

# A new push to a PR cancels its previous run. Other runs are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

# Read by setup-jfrog-cli
env:
  JF_PROJECT: platforms
  JF_URL: https://artifact.aerospike.io

jobs:
  prepare:
    name: Prepare
    # Fork PRs get no secrets or OIDC token, so nothing below can run for them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    outputs:
      base-version: ${{ steps.version.outputs.base-version }}
      version: ${{ steps.version.outputs.version }}
      init-build: ${{ steps.init.outputs.build }}
      init-name-tag: ${{ steps.init-image.outputs.name-tag }}
      suites: ${{ steps.tests.outputs.suites }}
      focus: ${{ steps.tests.outputs.focus }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      # e.g. 4.7.0-pr-620-a1b2c3d, 4.7.0-master-e4f5a6b, 4.7.0-nightly-e4f5a6b.
      # The short commit SHA ties every version, and so every release bundle, to
      # the commit it was built from. For a PR it is the PR's head commit.
      # The base is NEXT_VERSION, which must be newer than the last release tag,
      # or the dev versions would sort below that release.
      - name: Compute version
        id: version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base=$(sed -n 's/^NEXT_VERSION ?= *//p' Makefile)
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*')
          last=${last#v}
          if [ "$(printf '%s\n' "$last" "$base" | sort -V | tail -1)" = "$last" ]; then
            echo "::error::NEXT_VERSION ($base) must be newer than the last release ($last). Bump it in the Makefile."
            exit 1
          fi
          case "$GITHUB_EVENT_NAME" in
            pull_request) label="pr-$PR_NUMBER" ;;
            schedule) label="nightly" ;;
            *) label=$(echo "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g') ;;
          esac
          echo "base-version=$base" >> "$GITHUB_OUTPUT"
          echo "version=$base-$label-${SHA::7}" | tee -a "$GITHUB_OUTPUT"

      # The release bundle takes the init images by build-info number, which is
      # the run number of the init CI run that built INIT_TAG.
      # TODO(sidntrivedi): Add a build number input to reusable_docker-build-deploy.yaml in
      # shared-workflows, so the init CI can publish its build-info under INIT_TAG
      # and this lookup can go.
      - name: Resolve init build
        id: init
        env:
          GH_TOKEN: ${{ github.token }}
          INIT_REPO: aerospike/aerospike-kubernetes-init
        run: |
          tag=$(sed -n 's/^INIT_TAG ?= *//p' Makefile)
          case "$tag" in
            *-pr-*) event=pull_request ;;
            *-master-*) event=push ;;
            *) echo "::error::Unexpected INIT_TAG: $tag"; exit 1 ;;
          esac
          sha=$(gh api "repos/$INIT_REPO/commits/${tag##*-}" --jq .sha)
          build=$(gh api "repos/$INIT_REPO/actions/runs?head_sha=$sha&event=$event&status=success" \
            --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yaml")][0].run_number')
          if [ -z "$build" ] || [ "$build" = "null" ]; then
            echo "::error::No successful init CI run for $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=$build" | tee -a "$GITHUB_OUTPUT"

      - name: Set up JFrog CLI
        uses: step-security/setup-jfrog-cli@53aeacb709fce45d0baf69a13ec3342f7e2d71a9 # v5.1.0
        with:
          oidc-provider-name: gh-aerospike
          oidc-audience: aerospike

      # The release bundle holds only the timestamped tag that the init build-info
      # records, e.g. pr-166-dd04cc5_20261030T091706Z, not the plain INIT_TAG. The
      # chart, the OLM bundle and e2e use it, so it is there after promotion and
      # an init CI re-run can't move it.
      - name: Resolve init image
        id: init-image
        env:
          TAG: ${{ steps.init.outputs.tag }}
          BUILD: ${{ steps.init.outputs.build }}
        run: |
          # Module IDs are <image>:<tag>. The per-platform and attestation modules
          # add a prefix, e.g. linux/amd64/<image>:<tag>.
          name_tag=$(jf rt curl -s "/api/build/ako-init/$BUILD?project=platforms" |
            jq -r --arg prefix "aerospike-kubernetes-init:${TAG}_" \
              '[.buildInfo.modules[].id | sub(".*/"; "") | select(startswith($prefix))] | unique | .[]')
          if [ "$(grep -c . <<< "$name_tag")" -ne 1 ]; then
            echo "::error::Expected one aerospike-kubernetes-init:${TAG}_<timestamp> image in build ako-init/$BUILD, got: $name_tag"
            exit 1
          fi
          echo "name-tag=$name_tag" | tee -a "$GITHUB_OUTPUT"

      - name: Select e2e tests
        id: tests
        env:
          BASE_REF: ${{ github.base_ref }}
        # TODO: Revert. Runs every suite on PRs too, to test the e2e job.
        run: |
          if false && [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --name-only "origin/$BASE_REF...HEAD" | hack/ci/select-tests.sh
          else
            hack/ci/select-tests.sh all
          fi | tee -a "$GITHUB_OUTPUT"

      # The shared docker workflow checks out without submodules, and the
      # operator embeds pkg/configschema/schemas. Hand it the schemas instead.
      - name: Upload config schemas
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: config-schemas
          path: pkg/configschema/schemas/json/aerospike
          if-no-files-found: error
          retention-days: 1

  operator-image:
    name: Operator image
    needs: prepare
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: aerospike/shared-workflows/.github/workflows/reusable_docker-build-deploy.yaml@b4b1e9dc89314a2d542f9d6fe0ee150ad06f9860 # v5.0.0
    with:
      jf-project: platforms
      image-name: aerospike-kubernetes-operator
      app-version: ${{ needs.prepare.outputs.version }}
      jf-build-name: ako-operator
      build-args-json: '{"VERSION": "${{ needs.prepare.outputs.base-version }}"}'
      gh-context-artifacts-json: '[{"name": "config-schemas", "dest": "pkg/configschema/schemas/json/aerospike"}]'

  helm-charts:
    name: Helm charts
    needs: [prepare, operator-image]
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      OPERATOR_IMG: ${{ needs.operator-image.outputs.immutable-tag }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JFrog CLI
        uses: step-security/setup-jfrog-cli@53aeacb709fce45d0baf69a13ec3342f7e2d71a9 # v5.1.0
        with:
          oidc-provider-name: gh-aerospike
          oidc-audience: aerospike

      # The DEV operator chart deploys the operator image built in this run.
      # TODO: Decide if we want this. Without it, the chart keeps the original
      # image.
      - name: Set operator image
        run: |
          export REPO="${OPERATOR_IMG%:*}" TAG="${OPERATOR_IMG##*:}"
          yq -i '.operatorImage.repository = strenv(REPO) | .operatorImage.tag = strenv(TAG)' \
            helm-charts/aerospike-kubernetes-operator/values.yaml

      # The DEV operator chart deploys the INIT_TAG init image, the one in the
      # release bundle.
      # TODO: These point at the DEV repo. Promotion to TEST copies the images to
      # another repo, so these values have to change then.
      - name: Set init image
        env:
          INIT_NAME_TAG: ${{ needs.prepare.outputs.init-name-tag }}
        run: |
          yq -i '.aerospikeKubernetesInitRegistry = "artifact.aerospike.io" |
            .aerospikeKubernetesInitRegistryNamespace = "platforms-docker-dev-local" |
            .aerospikeKubernetesInitNameTag = strenv(INIT_NAME_TAG)' \
            helm-charts/aerospike-kubernetes-operator/values.yaml

      - name: Package charts
        run: |
          for chart in helm-charts/*/; do
            helm package "$chart" --version "$VERSION" --app-version "$VERSION" --destination dist
          done

      # Same layout as the shared deploy workflow: <chart>/<version>/<chart>-<version>.tgz.
      # --flat stops the local dist/ folder from becoming part of the path.
      - name: Upload charts to JFrog
        run: |
          jf rt upload "dist/(*)-${VERSION}.tgz" "platforms-helm-dev-local/{1}/${VERSION}/" --flat \
            --build-name=ako-helm-charts --build-number="$GITHUB_RUN_NUMBER" --project=platforms
          jf rt build-publish ako-helm-charts "$GITHUB_RUN_NUMBER" --project=platforms

  olm-bundle:
    name: OLM bundle manifests
    needs: [prepare, operator-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The OLM bundle deploys the INIT_TAG init image, the one in the release
      # bundle. make bundle takes it from config/manager/manager.yaml.
      # TODO: These point at the DEV repo. Promotion to TEST copies the images to
      # another repo, so these values have to change then.
      - name: Set init image
        env:
          INIT_NAME_TAG: ${{ needs.prepare.outputs.init-name-tag }}
        run: |
          yq -i '(select(.kind == "Deployment").spec.template.spec.containers[].env[] | select(.name == "AEROSPIKE_KUBERNETES_INIT_REGISTRY")).value = "artifact.aerospike.io" |
            (select(.kind == "Deployment").spec.template.spec.containers[].env[] | select(.name == "AEROSPIKE_KUBERNETES_INIT_REGISTRY_NAMESPACE")).value = "platforms-docker-dev-local" |
            (select(.kind == "Deployment").spec.template.spec.containers[].env[] | select(.name == "AEROSPIKE_KUBERNETES_INIT_NAME_TAG")).value = strenv(INIT_NAME_TAG)' \
            config/manager/manager.yaml

      - name: Generate bundle
        env:
          IMG: ${{ needs.operator-image.outputs.immutable-tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          make bundle IMG="$IMG" VERSION="$VERSION"
          mkdir -p ci-olm
          cp bundle.Dockerfile ci-olm/

      - name: Set up JFrog CLI
        uses: step-security/setup-jfrog-cli@53aeacb709fce45d0baf69a13ec3342f7e2d71a9 # v5.1.0
        with:
          oidc-provider-name: gh-aerospike
          oidc-audience: aerospike

      # The manifests are what the Red Hat community operators PR needs, so they
      # travel in the release bundle, as one zip of bundle/ (manifests/ and
      # metadata/ at its root) under aerospike-kubernetes-operator/<version>/.
      - name: Upload bundle manifests to JFrog
        if: github.event_name != 'schedule'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          zip_file="aerospike-kubernetes-operator-olm-${VERSION}.zip"
          (cd bundle && zip -qr "../$zip_file" .)
          jf rt upload "$zip_file" "platforms-generic-dev-local/aerospike-kubernetes-operator/${VERSION}/" --flat \
            --build-name=ako-olm-manifests --build-number="$GITHUB_RUN_NUMBER" --project=platforms
          jf rt build-publish ako-olm-manifests "$GITHUB_RUN_NUMBER" --project=platforms

      - name: Upload bundle manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: olm-bundle
          path: bundle/
          if-no-files-found: error
          retention-days: 1

      - name: Upload bundle Dockerfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: olm-bundle-dockerfile
          path: ci-olm/bundle.Dockerfile
          if-no-files-found: error
          retention-days: 1

  bundle-image:
    name: OLM bundle image
    needs: [prepare, olm-bundle]
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: aerospike/shared-workflows/.github/workflows/reusable_docker-build-deploy.yaml@b4b1e9dc89314a2d542f9d6fe0ee150ad06f9860 # v5.0.0
    with:
      jf-project: platforms
      image-name: aerospike-kubernetes-operator-bundle
      app-version: ${{ needs.prepare.outputs.version }}
      jf-build-name: ako-olm-bundle
      platforms: linux/amd64
      # Same as the plain `docker build` used for bundles so far
      provenance: "false"
      sbom: false
      # Relative to the workspace, not the context
      file: ci-olm/bundle.Dockerfile
      gh-context-artifacts-json: '[{"name": "olm-bundle", "dest": "bundle"}, {"name": "olm-bundle-dockerfile", "dest": "ci-olm"}]'

  scan:
    name: Vulnerability scan
    needs: [operator-image, bundle-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      OPERATOR_IMG: ${{ needs.operator-image.outputs.immutable-tag }}
      BUNDLE_IMG: ${{ needs.bundle-image.outputs.immutable-tag }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up JFrog CLI
        id: jf
        uses: step-security/setup-jfrog-cli@53aeacb709fce45d0baf69a13ec3342f7e2d71a9 # v5.1.0
        with:
          oidc-provider-name: gh-aerospike
          oidc-audience: aerospike

      - name: Login to JFrog
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: artifact.aerospike.io
          username: ${{ steps.jf.outputs.oidc-user }}
          password: ${{ steps.jf.outputs.oidc-token }}

      - name: Set up Snyk
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04

      # Same commands and thresholds as the Jenkins job
      - name: Scan dependencies
        run: snyk test --severity-threshold=high --fail-on=all

      - name: Scan operator image
        run: |
          docker pull "$OPERATOR_IMG"
          snyk container test "$OPERATOR_IMG" --severity-threshold=high --file=Dockerfile --policy-path=.snyk --fail-on=all

      - name: Scan bundle image
        run: |
          docker pull "$BUNDLE_IMG"
          snyk container test "$BUNDLE_IMG" --severity-threshold=high --file=Dockerfile --policy-path=.snyk --fail-on=all

  e2e:
    name: E2E ${{ matrix.suite }}
    needs: [prepare, bundle-image, scan]
    if: needs.prepare.outputs.suites != '[]'
    runs-on: ubuntu-24.04
    # GitHub-hosted runners stop a job after 6 hours.
    timeout-minutes: 360
    # All suites share one GKE cluster, so they run one at a time across all
    # runs, like the Jenkins lock. queue: max lets up to 100 jobs wait.
    concurrency:
      group: gke-e2e
      queue: max
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.prepare.outputs.suites) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install operator-sdk
        run: |
          make operator-sdk
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GKE_WIF_PROVIDER }}
          service_account: ${{ secrets.GKE_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          install_components: gke-gcloud-auth-plugin

      # gcloud writes a kubeconfig that uses gke-gcloud-auth-plugin, which
      # refreshes the cluster token. A plain access token expires after an hour,
      # long before the tests finish. get-gke-credentials (v3.0.0) can't be used:
      # its use_auth_provider writes the old "gcp" auth-provider, which kubectl
      # no longer supports.
      - name: Get GKE credentials
        env:
          GKE_CLUSTER: ${{ secrets.GKE_CLUSTER }}
          GKE_LOCATION: ${{ secrets.GKE_LOCATION }}
          GKE_PROJECT: ${{ secrets.GKE_PROJECT }}
        run: gcloud container clusters get-credentials "$GKE_CLUSTER" --location "$GKE_LOCATION" --project "$GKE_PROJECT"

      - name: Set up JFrog CLI
        id: jf
        uses: step-security/setup-jfrog-cli@53aeacb709fce45d0baf69a13ec3342f7e2d71a9 # v5.1.0
        with:
          oidc-provider-name: gh-aerospike
          oidc-audience: aerospike

      - name: Login to JFrog
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: artifact.aerospike.io
          username: ${{ steps.jf.outputs.oidc-user }}
          password: ${{ steps.jf.outputs.oidc-token }}

      # The backup tests store backups in the aerospike-kubernetes-operator-test
      # bucket, and cleanup-test-namespace.sh empties it.
      # TODO: Restore once the AWS_S3_ROLE_ARN secret exists. Until then the
      # credentials file below has empty keys, and the s3 storage backup test is
      # pending.
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      #   with:
      #     role-to-assume: ${{ secrets.AWS_S3_ROLE_ARN }}
      #     aws-region: us-east-1

      # The backup service tests read ~/.aws/credentials, not env vars.
      - name: Write AWS credentials file
        run: |
          mkdir -p ~/.aws
          printf '[default]\naws_access_key_id=%s\naws_secret_access_key=%s\naws_session_token=%s\n' \
            "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$AWS_SESSION_TOKEN" > ~/.aws/credentials

      - name: Write features.conf
        env:
          FEATURES_CONF_B64: ${{ secrets.AKO_FEATURES_CONF_B64 }}
        run: echo "$FEATURES_CONF_B64" | base64 -d > config/samples/secrets/features.conf

      # The docker config holds the JFrog login. test.sh turns it into the pull
      # secrets for the operator and init images. The custom init registry test
      # pulls the INIT_TAG init image from JFrog.
      - name: Run ${{ matrix.suite }}
        env:
          BUNDLE_IMG: ${{ needs.bundle-image.outputs.immutable-tag }}
          SUITE: ${{ matrix.suite }}
          FOCUS: ${{ needs.prepare.outputs.focus }}
          INIT_NAME_TAG: ${{ needs.prepare.outputs.init-name-tag }}
        run: |
          ./test/test.sh -b "$BUNDLE_IMG" -s "$HOME/.docker/config.json" -t "$SUITE" -f "$FOCUS" \
            -r artifact.aerospike.io -n platforms-docker-dev-local -i "$INIT_NAME_TAG"

      # Lists the failed specs in the job summary, with their logs, and as
      # annotations on the run. annotate_only skips the check run, so the job
      # needs no checks: write permission.
      - name: Report test results
        if: always()
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: test/test-results/*.xml
          check_name: E2E ${{ matrix.suite }}
          annotate_only: true
          detailed_summary: true
          failed_summary_logs: true

      - name: Clean up test cluster
        if: always()
        run: ./test/cleanup-test-namespace.sh || true

  release-bundle:
    name: Release bundle
    needs: [prepare, olm-bundle, helm-charts, scan, e2e]
    # e2e is skipped when the PR changes nothing that needs it.
    if: ${{ github.event_name != 'schedule' && !cancelled() && !failure() && needs.scan.result == 'success' }}
    permissions:
      contents: read
      id-token: write
    uses: aerospike/shared-workflows/.github/workflows/reusable_create-release-bundle.yaml@b4b1e9dc89314a2d542f9d6fe0ee150ad06f9860 # v5.0.0
    with:
      gh-workflows-ref: b4b1e9dc89314a2d542f9d6fe0ee150ad06f9860
      jf-project: platforms
      jf-bundle-name: aerospike-kubernetes-operator
      version: ${{ needs.prepare.outputs.version }}
      # Every build-info is published under the run number. The init ones under
      # the init CI's run number.
      jf-build-names: ako-operator:${{ github.run_number }},ako-olm-bundle:${{ github.run_number }},ako-olm-manifests:${{ github.run_number }},ako-helm-charts:${{ github.run_number }},ako-init:${{ needs.prepare.outputs.init-build }},ako-init-openshift:${{ needs.prepare.outputs.init-build }}

  promote-dev:
    name: Promote to DEV
    needs: [prepare, release-bundle]
    # A skipped e2e would otherwise skip this job too, even after the bundle
    # was created.
    if: ${{ !cancelled() && needs.release-bundle.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Set up JFrog CLI
        uses: step-security/setup-jfrog-cli@53aeacb709fce45d0baf69a13ec3342f7e2d71a9 # v5.1.0
        with:
          oidc-provider-name: gh-aerospike
          oidc-audience: aerospike

      - name: Promote release bundle to DEV
        uses: aerospike/shared-workflows/.github/actions/promote-release-bundle@b4b1e9dc89314a2d542f9d6fe0ee150ad06f9860 # v5.0.0
        with:
          bundle-name: aerospike-kubernetes-operator
          version: ${{ needs.prepare.outputs.version }}
          environment: DEV
          jf-project: platforms

  # The single required status check.
  ci-result:
    name: CI result
    needs: [prepare, operator-image, helm-charts, olm-bundle, bundle-image, scan, e2e, release-bundle, promote-dev]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Check results
        env:
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          if [ "$FORK_PR" = "true" ]; then
            echo "::error::CI does not run on fork PRs. A maintainer needs to push this branch to the repository."
            exit 1
          fi
          echo "Job results: $RESULTS"
          if [[ " $RESULTS " == *" failure "* || " $RESULTS " == *" cancelled "* ]]; then
            echo "::error::One or more CI jobs failed or were cancelled"
            exit 1
          fi
